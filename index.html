<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Conference Ops (Clean Build)</title>
  <style>
    body { font-family: Arial; padding:20px; }
    .btn { padding:6px 10px; margin:2px; cursor:pointer; }
    .modal { position:fixed; top:0; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.4);} 
    .modal-inner { background:#fff; padding:20px; width:400px; }
  </style>
</head>
<body>

<h2>Meeting Requests</h2>
<div id="requests"></div>
<button class="btn" onclick="openRequestModal()">+ New Request</button>

<div id="modal-root"></div>

<script>
let appData = {
  team:[{id:1,name:'Nick'},{id:2,name:'Maya'}],
  requests:[]
};

function render(){
  const rows = appData.requests.map(r => `
    <div>
      ${r.customer} | ${r.status || 'Requested'} | 
      ${r.preferred_member_id ? memberName(r.preferred_member_id) : (r.preferred_member_name || '-')}
      ${!r.status || r.status==='Requested' ? `<button onclick="claimRequest(${r.id})">Claim</button>`:''}
      ${r.status==='Claimed' ? `<button onclick="openRequestEditModal(${r.id})">Update</button>`:''}
    </div>
  `).join('');
  document.getElementById('requests').innerHTML = rows;
}

function memberName(id){ return appData.team.find(x=>x.id===id)?.name || '-'; }

function showModal(html){
  document.getElementById('modal-root').innerHTML = `<div class="modal"><div class="modal-inner">${html}</div></div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

function buildTimeOptions(){
  let out='';
  for(let h=8;h<=21;h++){
    for(let m of [0,30]){
      const val = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      out+=`<option value="${val}">${val}</option>`;
    }
  }
  return out;
}

function openRequestModal(){
  const memberOptions = `<option value="">None</option>` +
    appData.team.map(m=>`<option value="${m.id}">${m.name}</option>`).join('') +
    `<option value="other">Other</option>`;

  showModal(`
    <h3>New Request</h3>
    <input id="req-name" placeholder="Customer"><br>
    <select id="req-member" onchange="toggleOtherMember()">${memberOptions}</select>
    <div id="req-other-wrap" style="display:none;"><input id="req-other"></div>
    <br><button onclick="saveRequest()">Save</button>
  `);
}

function toggleOtherMember(){
  const val=document.getElementById('req-member').value;
  document.getElementById('req-other-wrap').style.display = val==='other'?'block':'none';
}

function saveRequest(){
  const memberVal=document.getElementById('req-member').value;
  const preferred_member_id = memberVal && memberVal!=='other'?parseInt(memberVal):null;
  const preferred_member_name = memberVal==='other'?document.getElementById('req-other').value:null;

  appData.requests.push({
    id: Date.now(),
    customer: document.getElementById('req-name').value,
    status:'Requested',
    preferred_member_id,
    preferred_member_name
  });

  closeModal();
  render();
}

function claimRequest(id){
  const r=appData.requests.find(x=>x.id===id);
  r.status='Claimed';
  r.member_id=1;
  render();
}

function openRequestEditModal(id){
  showModal(`
    <h3>Update</h3>
    <select id="status">
      <option>Scheduled</option>
      <option>Cancelled</option>
    </select>
    <br>
    <input type="date" id="date">
    <select id="time">${buildTimeOptions()}</select>
    <br>
    <button onclick="updateRequest(${id})">Save</button>
  `);
}

function updateRequest(id){
  const r=appData.requests.find(x=>x.id===id);
  r.status=document.getElementById('status').value;
  closeModal();
  render();
}

render();
</script>

</body>
</html>
